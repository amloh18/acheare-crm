[package]
name = "achare-desktop"
version = "0.1.0"
description = "Achare — People Operations and CRM Platform"
authors = ["Achare"]
license = "AGPL-3.0"
repository = "https://github.com/amloh18/acheare-crm"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "1", features = ["blocking", "json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
